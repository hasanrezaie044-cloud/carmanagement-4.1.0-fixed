name: Android Release Build

# Cloud-only build. Nothing here needs Android Studio installed anywhere.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Artifact to produce'
        type: choice
        options: [apk, aab, both]
        default: both

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — logic parity. Runs first and fast: if the native core disagrees with
  # the numbers the old React Native app produced, nothing else is worth building.
  # ---------------------------------------------------------------------------
  verify:
    name: Unit tests & logic parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Gate 2 — release build, signing, and a hard permission audit on the real
  # merged manifest inside the produced APK.
  # ---------------------------------------------------------------------------
  build:
    name: Release build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
            echo "path=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No signing keystore configured, release artifact will be unsigned."
          fi

      - name: Build release APK
        if: ${{ github.event.inputs.buildType != 'aab' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build release AAB
        if: ${{ github.event.inputs.buildType != 'apk' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      # This is the guarantee, not a hope: the audit reads the MERGED manifest out
      # of the built APK, so anything a transitive dependency sneaked in still fails.
      - name: Audit manifest permissions
        run: |
          chmod +x tools/check-permissions.sh
          ./tools/check-permissions.sh android/app/build/outputs/apk/release

      - name: Verify APK signature
        if: ${{ github.event.inputs.buildType != 'aab' }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          for apk in android/app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk" || {
              echo "::warning::APK is unsigned (no keystore secrets configured)"; }
          done

      - name: Upload APK
        if: ${{ github.event.inputs.buildType != 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: car-management-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: ${{ github.event.inputs.buildType != 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: car-management-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
