name: KhodroYar Android APK Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  build:
    name: Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KPW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" || { echo "::error::ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KP" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KA" || { echo "::error::ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$KPW" || { echo "::error::ANDROID_KEY_PASSWORD is missing"; exit 1; }
          echo "Signing secrets OK."

      - name: Decode keystore
        id: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"
          test -s "$RUNNER_TEMP/keystore/release.jks"
          echo "path=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            dist/KhodroYar-4.1.0-release-signed.apk
          ls -lh dist/KhodroYar-4.1.0-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhodroYar-4.1.0-release-signed
          path: dist/KhodroYar-4.1.0-release-signed.apk
          if-no-files-found: error
          retention-days: 30
